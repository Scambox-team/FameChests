# Baza PostgreSQL do gry na własnym komputerze:  docker compose up -d   (w folderze server/)
# Bezpiecznie: baza słucha TYLKO na localhost (127.0.0.1), a hasło jest długie, losowe i nie leży w repozytorium.
# 1. Wygeneruj hasło (np. w PowerShell: -join ((48..57)+(97..122) | Get-Random -Count 32 | % {[char]$_}))
# 2. W server/.env ustaw:  POSTGRES_PASSWORD=<hasło>  oraz  DATABASE_URL=postgres://postgres:<hasło>@localhost:5432/scambox
# Hasło działa tylko przy pierwszym utworzeniu bazy (wolumenu); dla istniejącej zmień je: ALTER USER postgres PASSWORD '...';
# NIE zmieniaj "127.0.0.1:" na samo "5432:" - wtedy baza jest widoczna z internetu (była już atakowana).
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD w server/.env (długie losowe hasło)}
      POSTGRES_DB: scambox
    ports:
      - "127.0.0.1:${PGPORT:-5432}:5432"
    volumes:
      - scambox-db:/var/lib/postgresql/data
volumes:
  scambox-db:
