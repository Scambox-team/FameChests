# ScamBox na własnym serwerze: self-hosted Supabase (docker-compose.yml - oficjalny plik Supabase, bez zmian)
# + serwer gry + HTTPS. Docker Compose sam dokleja ten plik do docker-compose.yml:
#   docker compose up -d
# Instrukcja: README.md w tym folderze.
#
# HTTPS - jedno z dwóch (COMPOSE_PROFILES w .env):
#   tunnel  Cloudflare Tunnel (cloudflared): serwer sam łączy się z Cloudflare - działa za CGNAT, żadnych otwartych portów
#   caddy   Caddy z certyfikatem Let's Encrypt: publiczne IP i otwarte porty 80/443
#
# BEZPIECZEŃSTWO: z internetu widać co najwyżej porty 80/443 Caddy (przy tunelu - nic). Supabase (Studio, API, Postgres,
# pooler) słucha wyłącznie na 127.0.0.1 - dostęp przez tunel SSH. Nie zmieniaj "127.0.0.1:" na samo "port:"
# (baza Postgres była już atakowana z internetu).

services:

  # pierwsza inicjalizacja bazy (migracje Supabase) na wolnym dysku trwa dłużej niż healthcheck z oficjalnego pliku
  db:
    healthcheck:
      start_period: 5m

  # --- Supabase: porty tylko na localhost (w oficjalnym pliku są otwarte na wszystkie adresy) ---

  api-gw:
    ports: !override
      - "127.0.0.1:${API_GW_HTTP_PORT:-8000}:8000/tcp"

  supavisor:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT}:5432"
      - "127.0.0.1:${POOLER_PROXY_PORT_TRANSACTION}:6543"

  # --- Supabase Auth (GoTrue): email + hasło graczy, mail z potwierdzeniem i z linkiem do nowego hasła ---
  # Gra sama pośredniczy w rejestracji i logowaniu (z gracza nikt nie rozmawia z GoTrue), więc tu ustawiamy tylko,
  # dokąd prowadzą linki z maili: na adres gry (obsługuje je /auth/v1/verify w serwerze gry), a nie na Kong.

  auth:
    environment:
      API_EXTERNAL_URL: ${GAME_PUBLIC_URL:?ustaw GAME_PUBLIC_URL w .env (adres gry, np. https://scambox.pl)}
      GOTRUE_SITE_URL: ${GAME_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${GAME_PUBLIC_URL}/**
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "ScamBox: potwierdź adres email"
      GOTRUE_MAILER_SUBJECTS_RECOVERY: "ScamBox: ustaw nowe hasło"

  # --- Gra ---

  game:
    container_name: scambox-game
    # Obraz: budowany z repozytorium (server/Dockerfile) albo pobrany gotowy z ghcr.io - patrz README.md
    image: ${GAME_IMAGE:-scambox:local}
    build:
      context: ../..
      dockerfile: server/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    # gra działa = strona logowania odpowiada 200 (update.sh czeka na to i w razie czego wraca do poprzedniej wersji)
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8000 && printf 'GET /login HTTP/1.0\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 15s
      timeout: 5s
      retries: 3
      # pierwszy start na pustej bazie wczytuje katalog i uzupełnia tabele - kilka minut
      start_period: 10m
    environment:
      # prosto do Postgresa (nie przez pooler): serwer używa przygotowanych zapytań, a w sieci Dockera nie ma po co
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      DB_SCHEMA: ${GAME_DB_SCHEMA:-famechests}
      SECRET_KEY: ${GAME_SECRET_KEY:?ustaw GAME_SECRET_KEY w .env (ten sam co na Azure, inaczej wszyscy zostaną wylogowani)}
      DATA_DIR: /data
      OPERATOR_NAME: ${GAME_OPERATOR_NAME:-}
      CONTACT_EMAIL: ${GAME_CONTACT_EMAIL:-}
      COOKIE_SECURE: ${GAME_COOKIE_SECURE:-1}
      # konta z emailem (Supabase Auth): adres w sieci Dockera, klucz service_role (tajny, jak hasło do bazy) i adres gry,
      # na który wracają linki z maili
      GOTRUE_URL: http://auth:9999
      GOTRUE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      PUBLIC_URL: ${GAME_PUBLIC_URL}
      TRUST_PROXY: "1"
      METRICS_ADDR: ""
      RUST_LOG: ${GAME_RUST_LOG:-scambox=info}
      # właściciele (id kont): jedyni, którzy pobiorą kopię bazy z panelu; ich kont nie zmieni inny admin
      OWNER_IDS: ${GAME_OWNER_IDS:-}
      # kopie bazy (pg_dump schematu gry): automatyczne co N godzin + ręczne z panelu
      BACKUP_DIR: /backups
      BACKUP_EVERY_HOURS: ${GAME_BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP: ${GAME_BACKUP_KEEP:-14}
    volumes:
      # zdjęcia (image_cache/) i pliki od admina - przetrwają restart i aktualizację obrazu
      - game-data:/data
      # kopie bazy widoczne na serwerze w ./backups/game (do skopiowania poza serwer)
      - ./backups/game:/backups
    ports:
      # tylko localhost: do testów (curl) albo dla własnego reverse proxy zamiast Caddy
      - "127.0.0.1:${GAME_PORT:-5000}:8000"

  # --- HTTPS, wariant "tunnel": Cloudflare Tunnel ---
  # Trasy (scambox.pl -> http://game:8000) ustawia się w panelu Cloudflare: Zero Trust -> Networks -> Tunnels -> Routes

  cloudflared:
    container_name: scambox-cloudflared
    image: cloudflare/cloudflared:2026.10.7
    profiles: [tunnel]
    restart: unless-stopped
    depends_on:
      - game
    command: tunnel --no-autoupdate run
    environment:
      # token z panelu Cloudflare (polecenie "docker run ... --token <TO>") - tajny, tylko w .env
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # --- HTTPS, wariant "caddy": certyfikat Let's Encrypt wystawia się sam (wymaga publicznego IP) ---

  caddy:
    container_name: scambox-caddy
    image: caddy:2.10
    profiles: [caddy]
    restart: unless-stopped
    depends_on:
      - game
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      GAME_DOMAIN: ${GAME_DOMAIN:-localhost}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  game-data:
  caddy-data:
  caddy-config:
